<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Brew Logger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f5f2; color: #4e342e; }
        .navbar { background-color: #4e342e; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-custom { background-color: #6d4c41; color: white; border-radius: 8px; }
        .btn-custom:hover { background-color: #5d4037; color: white; }
        .rating-star { color: #ffc107; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fs-3">☕ Coffee Logger</span>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Recent Brews</h2>
            <a href="/add" class="btn btn-custom px-4 py-2">+ Add New Brew</a>
        </div>

        <div class="row">
            {% for brew in brews %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 p-3">
                    <div class="card-body">
                        <h4 class="card-title fw-bold">{{ brew.bean_name }}</h4>
                        <h6 class="card-subtitle mb-3 text-muted">{{ brew.method }} • Grind: {{ brew.grind_size }}</h6>
                        <p class="card-text">{{ brew.notes }}</p>
                    </div>
                    <div class="card-footer bg-transparent border-0 text-end">
                        <span class="rating-star">⭐ {{ brew.rating }} / 10</span>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12 text-center mt-5">
                <h5 class="text-muted">No records yet. Brew your first coffee and add it!</h5>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
