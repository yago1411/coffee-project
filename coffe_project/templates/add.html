<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Brew</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f5f2; color: #4e342e; }
        .navbar { background-color: #4e342e; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-custom { background-color: #6d4c41; color: white; border-radius: 8px; }
        .btn-custom:hover { background-color: #5d4037; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a href="/" class="navbar-brand mb-0 h1 fs-3 text-decoration-none">☕ Coffee Logger</a>
        </div>
    </nav>

    <div class="container d-flex justify-content-center">
        <div class="card p-4 w-100" style="max-width: 600px;">
            <h3 class="mb-4 fw-bold">New Brew Log</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Bean Name / Origin</label>
                    <input type="text" name="bean_name" class="form-control" placeholder="e.g., Ethiopia Yirgacheffe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Brew Method</label>
                    <select name="method" class="form-select">
                        <option value="V60">V60</option>
                        <option value="French Press">French Press</option>
                        <option value="Espresso">Espresso</option>
                        <option value="AeroPress">AeroPress</option>
                        <option value="Moka Pot">Moka Pot</option>
                        <option value="Turkish Coffee">Turkish Coffee</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Grind Size</label>
                    <input type="text" name="grind_size" class="form-control" placeholder="e.g., Medium-Fine (15 Clicks)">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Rating (1-10)</label>
                    <input type="number" name="rating" class="form-control" min="1" max="10" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Tasting Notes</label>
                    <textarea name="notes" class="form-control" rows="3" placeholder="e.g., Distinct chocolate and citrus acidity..."></textarea>
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2 fw-bold">Save</button>
            </form>
        </div>
    </div>
</body>
</html>
